name: e10_cost
seeds: 5
duration_s: 20
protocols: [proposed]
fixed:
  worst_case_tries: true     # every packet received in SUSPECT/LOST costs W MAC checks
sweep:
  rate: ["F1000Hz", "F500Hz", "500Hz", "333HzFull", "250Hz", "150Hz", "100HzFull", "50Hz"]
  cost_c_us: [1.0, 1.5, 2.1, 3.1, 4.5, 6.6, 9.6, 14.0, 20.5, 29.9, 43.6, 63.7, 92.9, 135.6, 198.0]
  window: [1, 8, 16, 32, 64]
  ge: {burst: [200], err: [0.0, 0.2]}   # err 0: normal operation; 0.2: frequent SUSPECT/LOST
skip:
  - {"ge.err": 0.0, "window": [8, 32, 64]}
