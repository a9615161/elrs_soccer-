# ExpressLRS baseline parameters (2.4 GHz SX1280, ISM2G4 domain).
# Every value carries the file + line in ExpressLRS 4.1.0 it was read from.
elrs_tag: "4.1.0"
elrs_commit: a9d4a9cb5b5687c4c9d7e9e7fbdf44ad93651da6

fhss:
  num_channels: {value: 80, source: "src/lib/FHSS/FHSS.cpp L52 (ISM2G4: 2400.4-2479.4 MHz, 80 ch)"}
  sync_channel: {value: 40, source: "src/lib/FHSS/FHSS.cpp L94 (freq_count / 2)"}
  sequence_len: {value: 240, source: "src/lib/FHSS/FHSS.cpp L96 ((256 / 80) * 80); FHSS.h L23"}
  sequence_build: {value: "LCG a=214013 c=2531011 m=2^31, block shuffle", source: "src/lib/FHSS/random.cpp L8-26; FHSS.cpp L134-175"}
  seed: {value: "UID[2..5] with UID[5]^OTA_VERSION_ID(4)", source: "src/lib/OTA/OTA.cpp L41-45; include/targets.h L8"}

# interval = packet period; hop_interval = packets per hop; tlm = 1 telemetry slot per N
