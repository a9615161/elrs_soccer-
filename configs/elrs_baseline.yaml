ota4_packet:
  size_bytes: {value: 8, source: "src/lib/OTA/OTA.h L13 (OTA4_PACKET_SIZE)"}
  type_bits: {value: 2, source: "src/lib/OTA/OTA.h L59"}
  crc_bits: {value: 14, source: "src/lib/OTA/OTA.h L59-60 crcHigh:6 + crcLow:8"}
  rc_channels: {value: "4 x 10-bit + switches:7 + isArmed:1", source: "src/lib/OTA/OTA.h L52-67"}
  crc_init: {value: "(UID[4] << 8 | UID[5]) ^ (OTA_VERSION_ID << 8), xor nonce", source: "src/lib/OTA/OTA.cpp L28-38, L533"}
  sync_fields: {value: "fhssIndex, nonce, rfRateEnum, flags, UID4, UID5(^modelId)", source: "src/lib/OTA/OTA.h L28-39"}

link_quality:
  window_packets: {value: 100, source: "src/src/rx_main.cpp L149 (LQCALC<100>)"}
  min_lq_formula: {value: "H * ((H*N + 99) // (H*N)); 4 at hop_interval 4, 2 at hop_interval 2; connect needs LQ > this", source: "src/src/rx_main.cpp L225-239 (minLqForChaos)"}

rx_state_machine:
  disconnect_rule: {value: "connected and now - LastValidPacket > DisconnectTimeoutMs", source: "src/src/rx_main.cpp L2113"}
  tentative_abort: {value: "tentative and now - LastSyncPacket > RxLockTimeoutMs", source: "src/src/rx_main.cpp L2102"}
  connect_rule: {value: "tentative and |LPF_OffsetDx| <= 10 and LPF_Offset < 100 and LQ > minLqForChaos", source: "src/src/rx_main.cpp L2118"}
  pfd_filters: {value: "LPF_Offset beta 2, LPF_OffsetDx beta 4, FP shift 5; tentative phaseShift(RawOffset >> 1)", source: "src/src/rx_main.cpp L145-146, L609-632; include/LowPassFilter.h"}
  tock_slack: {value: "TOCK = packet end + max(interval - 2*TOA, 200 us); nonce and hop advance at TOCK", source: "src/src/rx_main.cpp L73, L1124-1125, L781"}
  tock_slack_min_us: {value: 200, source: "src/src/rx_main.cpp L73 (PACKET_TO_TOCK_SLACK)"}
  rf_cycle: {value: "if !LockRFmode, dwell = 1.1 * N * H * interval per rate; first dwell x5 after boot, x10 after a received packet, then x1", source: "src/src/rx_main.cpp L188, L354, L1191, L1603, L1622-1651"}
  lock_on_first_connection: {value: true, source: "src/lib/OPTIONS/options.cpp L200; src/user_defines.txt L33"}
  on_disconnect: {value: "timer stopped, radio parked on sync channel (initial freq)", source: "src/src/rx_main.cpp L798-829"}
  sync_accept: {value: "sets FHSS index + nonce, -> tentative", source: "src/src/rx_main.cpp L1079-1090"}
  failsafe: {value: "output failsafe while connectionState == disconnected", source: "src/src/rx-serial/devSerialIO.cpp L73"}
  telemetry_when_disconnected: {value: false, source: "src/src/rx_main.cpp L456"}

tx_state_machine:
  sync_rule: {value: "on sync channel, (syncSlot/2) <= nonce % hop_interval, now - last sync > SyncInterval", source: "src/src/tx_main.cpp L539-559"}
  rx_lost_timeout_ms: {value: "max(512, tlm_ratio * period_us / 200) + 2", source: "src/src/tx_main.cpp L902-906"}

# All SX1280 rates in ExpressLRS_AirRateConfig order, for the RF-mode cycle (interval_us, hop_interval).
rf_cycle_table:
  value: [[1000, 2], [2000, 2], [1000, 2], [1000, 2], [2000, 4], [3003, 4], [4000, 4], [6666, 4], [10000, 4], [20000, 2]]
  source: "src/src/common.cpp L82-91"

# Values below are NOT from ExpressLRS; assumptions to be calibrated on hardware.
assumptions:
  fixed_overhead_us: {value: 100, source: "ASSUMPTION: ISR latency + TX/RX turnaround + PLL settle (SX1280 DS, to be measured)"}
  isr_jitter_us: {value: 15, source: "ASSUMPTION: std dev of ISR/timer jitter (logic-analyser to be measured)"}
  pfd_initial_offset_us: {value: 50, source: "ASSUMPTION: std dev of PFD raw offset when entering tentative; to be measured on RP1"}
