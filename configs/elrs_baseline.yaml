    mode: lora
    rf_index: {value: 4, source: "src/src/common.cpp L86 (index in ExpressLRS_AirRateConfig)"}
    sf: 5
    bw_khz: 812.5
    cr: "LI_4_6"
    preamble: 12
    payload_bytes: 8
    period_us: {value: 2000, source: "src/src/common.cpp L86"}
    hop_interval: {value: 4, source: "src/src/common.cpp L86"}
    tlm_ratio: {value: 128, source: "src/src/common.cpp L86 (TLM_RATIO_1_128)"}
